name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'manaforged/haste' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install rust-src and rustfmt
        run: rustup component add rust-src rustfmt
      - name: Check formatting and file sizes
        run: |
          cargo fmt --all --check
          python3 -c 'import pathlib; bad=[(p.read_bytes().count(b"\n"), str(p)) for p in sorted(pathlib.Path("crates").rglob("*.rs")) if p.read_bytes().count(b"\n") > 800]; assert not bad, f"files over 800 lines: {bad}"'
      - name: Run unit and public API tests
        run: |
          cargo check --locked -p haste
          cargo test --locked -p haste-codegen -p haste --lib
          cargo test --locked -p haste --test compiler_api
      - name: Build haste
        run: cargo build --locked --release -p haste --features diff-harness
      - name: Run differential and probe suites
        env:
          HASTE_BIN: ${{ github.workspace }}/target/release/haste
          HASTE_VERIFY_PASSES: "1"
        run: |
          bash scripts/check.sh
          bash scripts/check.sh tests/async
          bash scripts/check.sh tests/proc-macro
          bash scripts/probes.sh
