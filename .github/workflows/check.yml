name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'manaforged/haste' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Build haste
        run: cargo build --locked --release -p haste
      - name: Run differential and probe suites
        env:
          HASTE_BIN: ${{ github.workspace }}/target/release/haste
        run: |
          bash scripts/check.sh
          bash scripts/check.sh tests/async
          bash scripts/check.sh tests/proc-macro
          bash scripts/probes.sh
