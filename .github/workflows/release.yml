name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'manaforged/haste'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Install rust-src
        run: rustup component add rust-src
      - name: Build release binary
        run: cargo build --locked --release -p haste
      - name: Verify checked-out tag and binary version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            ""|*[[:space:]]*|*..*|/*|*/|*//*)
              echo "invalid release tag: '$RELEASE_TAG'" >&2
              exit 1
              ;;
          esac
          HEAD_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${HEAD_SHA:0:8}"
          BIN="target/release/haste"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="target/release/haste.exe"
          fi
          ACTUAL_VER="$("$BIN" --version)"
          echo "Built version: $ACTUAL_VER (commit $SHORT_SHA, tag $RELEASE_TAG)"
          case "$ACTUAL_VER" in
            *"($SHORT_SHA)"*) ;;
            *)
              echo "version mismatch: expected ($SHORT_SHA) in '$ACTUAL_VER'" >&2
              exit 1
              ;;
          esac
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          NAME="haste-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp target/release/haste LICENSE-MIT README.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $name = "haste-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/haste.exe, LICENSE-MIT, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.target }}
          path: dist/haste-*.*

  publish:
    if: github.repository == 'manaforged/haste'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum haste-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_TAG" >/dev/null
          gh release create "$RELEASE_TAG" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "haste $RELEASE_TAG" \
            --generate-notes
