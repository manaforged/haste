[workspace]
members = ["crates/codegen", "crates/haste"]
exclude = ["examples", "tests"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/manaforged/haste"
homepage = "https://github.com/manaforged/haste"
keywords = ["compiler", "rust", "jit", "aot", "hot-reload"]
categories = ["compilers", "development-tools"]

[workspace.lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
