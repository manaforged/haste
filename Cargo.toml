[workspace]
members = ["crates/codegen", "crates/haste"]
exclude = ["crates/prep-driver", "examples", "tests"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/manaforged/haste"
homepage = "https://github.com/manaforged/haste"
keywords = ["compiler", "rust", "jit", "aot"]
categories = ["compilers", "development-tools"]
