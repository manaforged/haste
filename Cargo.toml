[package]
name = "engine-tracer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
exclude = ["hello", "patch"]

[dependencies]
anyhow = "1"
either = "1"
libc = "0.2"
triomphe = "0.1"
rustc_abi = { package = "ra-ap-rustc_abi", version = "0.166", default-features = false }
rustc_type_ir = { package = "ra-ap-rustc_type_ir", version = "0.166", default-features = false }
base-db = { git = "https://github.com/rust-lang/rust-analyzer", rev = "55effabb762bbd0a21c5af530ea447bd6772881d" }
hir-def = { git = "https://github.com/rust-lang/rust-analyzer", rev = "55effabb762bbd0a21c5af530ea447bd6772881d" }
hir-ty = { git = "https://github.com/rust-lang/rust-analyzer", rev = "55effabb762bbd0a21c5af530ea447bd6772881d" }
load-cargo = { git = "https://github.com/rust-lang/rust-analyzer", rev = "55effabb762bbd0a21c5af530ea447bd6772881d" }
project-model = { git = "https://github.com/rust-lang/rust-analyzer", rev = "55effabb762bbd0a21c5af530ea447bd6772881d" }
ide-db = { git = "https://github.com/rust-lang/rust-analyzer", rev = "55effabb762bbd0a21c5af530ea447bd6772881d" }
paths = { git = "https://github.com/rust-lang/rust-analyzer", rev = "55effabb762bbd0a21c5af530ea447bd6772881d" }
