[workspace]
members = [".", "corelib", "worker"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"

[package]
name = "ws"
version = "0.1.0"
edition = "2021"

[dependencies]
corelib = { path = "corelib" }
worker = { path = "worker" }
serde_json.workspace = true
